[project]
name = "ai-receptionist"
version = "0.1.0"
description = "AI phone receptionist that books meetings on Cal.com (LiveKit + Claude + Cartesia + Deepgram)"
requires-python = ">=3.10"
dependencies = [
    "livekit>=1.0",
    "livekit-agents>=1.0",
    "livekit-plugins-anthropic>=1.2.6",
    "livekit-plugins-deepgram>=1.0",
    "livekit-plugins-cartesia>=1.0",
    "livekit-plugins-silero>=1.0",
    "livekit-plugins-turn-detector>=1.0",
    "livekit-plugins-noise-cancellation>=0.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[tool.uv]
dev-dependencies = []
