[project]
name = "cold-caller"
version = "0.1.0"
description = "AI cold caller that books meetings via Cal.com (LiveKit + Claude + Telnyx)"
requires-python = ">=3.10"
dependencies = [
    "livekit>=1.0",
    "livekit-agents>=1.0",
    "livekit-plugins-anthropic>=1.2.6",
    "livekit-plugins-deepgram>=1.0",
    "livekit-plugins-cartesia>=1.0",
    "livekit-plugins-silero>=1.0",
    "livekit-plugins-turn-detector>=1.0",
    "livekit-plugins-noise-cancellation>=0.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[tool.uv]
dev-dependencies = []
